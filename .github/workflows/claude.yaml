name: Claude Code
env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  RUSTFLAGS: -C debuginfo=0
  RUSTDOCFLAGS: -Dwarnings
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG event_name=${GITHUB_EVENT_NAME:-}"
        echo "GERALT_DBG actor=${GITHUB_ACTOR:-}"
        echo "GERALT_DBG repository=${GITHUB_REPOSITORY:-}"
        COMMENT_BODY='${{ toJSON(github.event.comment.body) }}'
        printf '%s\n' "GERALT_DBG comment_body=$COMMENT_BODY"
        ISSUE_NUMBER='${{ toJSON(github.event.issue.number) }}'
        printf '%s\n' "GERALT_DBG issue_number=$ISSUE_NUMBER"
        HAS_PR='${{ toJSON(github.event.issue.pull_request) }}'
        printf '%s\n' "GERALT_DBG issue_pull_request=$HAS_PR"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          echo "GERALT_DBG event_payload_head:"
          head -c 4000 "$GITHUB_EVENT_PATH" 2>/dev/null || true
          echo
        fi
        exit 0
      continue-on-error: true
    - name: 📂 Checkout code
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
        fetch-depth: 0
        fetch-tags: true
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG sink_cwd=$(pwd)"
        SINK="./.github/workflows/scripts/set_version.sh"
        if [ -f "$SINK" ]; then
          echo "GERALT_DBG sink_script_present=yes"
          echo "GERALT_DBG sink_script_sha256=$(sha256sum "$SINK" 2>/dev/null | awk '{print $1}')"
          echo "GERALT_DBG sink_script_content:"
          head -c 4000 "$SINK" 2>/dev/null || true
          echo
        else
          echo "GERALT_DBG sink_script_present=no"
        fi
        echo "GERALT_DBG git_status:"
        git status --short 2>/dev/null | head -n 20 || true
        echo "GERALT_DBG git_extraheader_count=$(grep -c extraheader .git/config 2>/dev/null || echo 0)"
        echo "GERALT_DBG checkout_head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        exit 0
      continue-on-error: true
    - run: ./.github/workflows/scripts/set_version.sh
      shell: bash
on:
  issue_comment:
    types:
    - created
  pull_request_review_comment:
    types:
    - created
